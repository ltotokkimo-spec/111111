name: Build Release Binaries

# 當推送形如 v1.0.0 的 tag 時觸發，自動打包三平台執行檔並上傳到 GitHub Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: ScreenClickBot.exe
            asset_name: ScreenClickBot-windows.exe
          - os: macos-latest
            artifact_name: ScreenClickBot
            asset_name: ScreenClickBot-macos
          - os: ubuntu-latest
            artifact_name: ScreenClickBot
            asset_name: ScreenClickBot-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux GUI/OCR system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk scrot tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ScreenClickBot screen_watcher.py

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.artifact_name }}" "out/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
